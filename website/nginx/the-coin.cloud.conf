# The Coin — nginx configuration for https://the-coin.cloud
#
# Install:
#   sudo cp the-coin.cloud.conf /etc/nginx/sites-available/the-coin.cloud
#   sudo ln -s /etc/nginx/sites-available/the-coin.cloud /etc/nginx/sites-enabled/
#   sudo certbot certonly --nginx -d the-coin.cloud -d www.the-coin.cloud
#   sudo nginx -t && sudo systemctl reload nginx
#
# The API upstream points at the seed nodes. On each seed node set
#   [rpc] listen = "0.0.0.0:7334"
# and firewall port 7334 so that ONLY this web server can reach it.

# ---- rate limiting & cache (http context) ---------------------------------
limit_req_zone  $binary_remote_addr zone=thecoin_api:10m     rate=10r/s;
limit_req_zone  $binary_remote_addr zone=thecoin_submit:10m  rate=1r/s;
limit_conn_zone $binary_remote_addr zone=thecoin_conn:10m;

proxy_cache_path /var/cache/nginx/thecoin_api levels=1:2 keys_zone=thecoin_api_cache:10m
                 max_size=100m inactive=10m use_temp_path=off;

upstream thecoin_nodes {
    server seed1.the-coin.cloud:7334 max_fails=3 fail_timeout=15s;
    server seed2.the-coin.cloud:7334 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

# ---- HTTP → HTTPS ----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name the-coin.cloud www.the-coin.cloud;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://the-coin.cloud$request_uri; }
}

# ---- www → apex -------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.the-coin.cloud;

    ssl_certificate     /etc/letsencrypt/live/the-coin.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/the-coin.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://the-coin.cloud$request_uri;
}

# ---- main site ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name the-coin.cloud;

    ssl_certificate     /etc/letsencrypt/live/the-coin.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/the-coin.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/the-coin.cloud;
    index index.html;
    charset utf-8;

    # Security headers (the site uses no external resources).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    limit_conn thecoin_conn 40;
    # A contract deployment transaction can have 64 KB (128 KB as hex in JSON);
    # the node itself accepts API bodies up to 256 KB.
    client_max_body_size 256k;

    # Static pages
    location / {
        try_files $uri $uri/ =404;
    }

    # Note: `add_header` inside a location drops the server-level headers above,
    # so locations use `expires` (which does not) instead.
    location /assets/ {
        expires 1h;
    }

    # Installer scripts (served as plain text so `curl | bash` works)
    location = /install.sh {
        default_type text/plain;
        expires -1;
    }
    location = /uninstall.sh {
        default_type text/plain;
        expires -1;
    }

    # Release binaries + SHA256SUMS
    location /releases/ {
        autoindex on;
        autoindex_exact_size off;
        types { application/gzip gz; text/plain txt; }
        default_type application/octet-stream;
    }

    # Whitepaper PDFs (current v0.2 and earlier versions)
    location /whitepaper/ {
        autoindex on;
        types { application/pdf pdf; }
    }

    # TCCL cookbook PDF and example contracts (/tccl/examples/<name>.tccl)
    location /tccl/ {
        autoindex on;
        charset utf-8;
        types { application/pdf pdf; text/plain tccl; }
        default_type text/plain;
    }

    # ---- node API proxy ----
    # Transaction submission: stricter rate limit, never cached.
    location = /api/v1/tx {
        limit_except GET POST { deny all; }
        limit_req zone=thecoin_submit burst=5 nodelay;
        proxy_pass http://thecoin_nodes;
        include /etc/nginx/snippets/thecoin-proxy.conf;
        # Resubmitting the same signed transaction is harmless (same txid).
        proxy_next_upstream error timeout non_idempotent http_502 http_503 http_504;
    }

    location /api/ {
        limit_except GET POST { deny all; }
        limit_req zone=thecoin_api burst=40 nodelay;

        proxy_pass http://thecoin_nodes;
        include /etc/nginx/snippets/thecoin-proxy.conf;

        # Short cache for GETs: the chain changes about once per minute.
        proxy_cache thecoin_api_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 5s;
        proxy_cache_valid 404 5s;
        proxy_cache_lock on;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }
}

# The shared proxy settings live in nginx/snippets/thecoin-proxy.conf
# (install it as /etc/nginx/snippets/thecoin-proxy.conf).
