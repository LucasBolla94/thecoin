name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # RandomX is a C++ library: Linux builds are gnu, built natively or
          # with cross (which provides cmake and a C++ toolchain).
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, cross: false }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: x86_64-apple-darwin, os: macos-13, cross: false }
          - { target: aarch64-apple-darwin, os: macos-14, cross: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, cross: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build tools for RandomX
        if: runner.os == 'Linux' && matrix.cross == false
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake g++
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          # tccl (the contract tool) is built from the language repository at
          # the tag pinned in Cargo.toml.
          tag=$(awk -F'"' '/^tccl *=/ {for (i = 1; i < NF; i++) if ($i ~ /tag *= *$/) print $(i + 1)}' Cargo.toml)
          git clone -q --depth 1 --branch "$tag" https://github.com/LucasBolla94/tccl tccl-src
          build=cargo; [ "${{ matrix.cross }}" = "true" ] && build=cross
          $build build --release --locked --target ${{ matrix.target }} -p thecoin-node -p thecoin-wallet
          (cd tccl-src && $build build --release --locked --target ${{ matrix.target }} -p tccl-cli)
      - name: Package
        shell: bash
        run: |
          mkdir -p stage/thecoin dist
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp target/${{ matrix.target }}/release/thecoind$ext target/${{ matrix.target }}/release/thecoin-wallet$ext tccl-src/target/${{ matrix.target }}/release/tccl$ext stage/thecoin/
          cp README.md LICENSE-MIT LICENSE-APACHE installer/install.sh installer/uninstall.sh installer/thecoin stage/thecoin/
          name=thecoin-${{ matrix.target }}.tar.gz
          tar -C stage -czf dist/$name thecoin
          cd dist && (sha256sum $name 2>/dev/null || shasum -a 256 $name) > $name.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: thecoin-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            installer/install.sh
            installer/uninstall.sh
            installer/thecoin
            docs/whitepaper/the-coin-whitepaper-v0.2.pdf
            docs/tccl/tccl-cookbook.pdf
          generate_release_notes: true
