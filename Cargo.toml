[workspace]
resolver = "2"
members = ["crates/core", "crates/storage", "crates/node", "crates/wallet"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LucasBolla94/thecoin"
homepage = "https://the-coin.cloud"
rust-version = "1.88"

[workspace.dependencies]
thecoin-core = { path = "crates/core" }
thecoin-storage = { path = "crates/storage" }
thecoin-wallet = { path = "crates/wallet" }
borsh = { version = "1.5", features = ["derive"] }
blake3 = "1.5"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = "2.1"
argon2 = { version = "0.5", features = ["alloc"] }
primitive-types = { version = "0.12", default-features = false }
bech32 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
anyhow = "1"
redb = "2.6"
zstd = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["cors", "timeout", "limit"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
toml = "0.8"
rand = "0.8"
libc = "0.2"
bip39 = "2"
chacha20poly1305 = "0.10"
ureq = { version = "2", features = ["json"] }
rpassword = "7"
zeroize = "1"
dirs = "5"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
