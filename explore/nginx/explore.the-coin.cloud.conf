# The Coin — nginx configuration for https://explore.the-coin.cloud (static explorer)
#
# Install (on the website machine, from the repository checkout):
#   sudo scripts/deploy-explorer.sh --setup    # copies explore/, installs this file and gets the certificate
#
# The browser talks directly to the seed nodes' public HTTPS APIs (see
# explore/assets/networks.js); each seed must list https://explore.the-coin.cloud
# in [rpc] cors_origins.

server {
    listen 80;
    listen [::]:80;
    server_name explore.the-coin.cloud;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://explore.the-coin.cloud$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name explore.the-coin.cloud;

    ssl_certificate     /etc/letsencrypt/live/explore.the-coin.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/explore.the-coin.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root  /var/www/explore.the-coin.cloud;
    index index.html;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://testnet-seed1.the-coin.cloud https://testnet-seed2.the-coin.cloud https://seed1.the-coin.cloud https://seed2.the-coin.cloud; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        expires 7d;
    }
    location ~ /\. { deny all; }
}
