# The Coin — nginx configuration for https://wallet.the-coin.cloud (static wallet)
#
# Install (on the website machine, from the repository checkout):
#   sudo scripts/deploy-wallet.sh --setup    # copies wallet/, installs this file and gets the certificate
#
# The page signs transactions in the browser and talks directly to the seed
# nodes' public HTTPS APIs; each node must list https://wallet.the-coin.cloud in
# [rpc] cors_origins. No key material ever leaves the browser.

server {
    listen 80;
    listen [::]:80;
    server_name wallet.the-coin.cloud;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://wallet.the-coin.cloud$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wallet.the-coin.cloud;

    ssl_certificate     /etc/letsencrypt/live/wallet.the-coin.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallet.the-coin.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root  /var/www/wallet.the-coin.cloud;
    index index.html;
    charset utf-8;

    # A wallet is worth attacking: keep it in its own origin, never in a frame,
    # and let it load nothing but its own files.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    add_header Cross-Origin-Resource-Policy same-site always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://testnet-seed1.the-coin.cloud https://testnet-seed2.the-coin.cloud https://seed1.the-coin.cloud https://seed2.the-coin.cloud; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # connect.js is the small library other sites import to ask for payments,
    # so it is the one file any origin may load. `add_header` in a location
    # replaces the server-level headers, so the important ones are repeated.
    location = /connect.js {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        types { } default_type "text/javascript; charset=utf-8";
    }

    location /assets/ {
        expires 7d;
    }
    location ~ /\. { deny all; }
}
